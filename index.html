<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Word Hunt Solver</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>
<body>

    <div class="container">

        <h1>Word Hunt Solver</h1>

        <p class="subtitle">
            Enter the letters from your 4×4 board
            and click Solve.
        </p>

        <!-- BOARD -->

        <div class="board-container">

            <!-- SVG RED PATH DRAWING -->

            <svg id="pathOverlay"></svg>

            <!-- LETTER GRID -->

            <div
                id="letterGrid"
                class="grid"
            >

                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">
                <input type="text" maxlength="1" autocomplete="off">

            </div>

        </div>

        <!-- BUTTONS -->

        <div class="button-row">

            <button
                id="solveBtn"
                disabled
            >
                Loading…
            </button>

            <button id="clearBtn">
                Clear
            </button>

            <button id="nextBtn">
                Next
            </button>

        </div>

        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">
                <div class="stat-title">Words Found</div>
                <div id="wordCount" class="stat-value">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Max Score</div>
                <div id="maxScore" class="stat-value">0</div>
            </div>

        </div>

        <!-- RESULTS -->

        <div
            id="results"
            class="results"
        >

            <div class="placeholder">
                Enter letters and click Solve.
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
