<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Word Hunt Solver</title>

	<link rel="icon" type="image/png" href="favicon.png">

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>
<body>

    <div class="container">

        <h1>Word Hunt Solver</h1>

        <p class="subtitle">
            Enter the letters from your 4×4 board
            and click Solve.
        </p>

        <!-- BOARD -->

        <div class="board-container">

            <!-- SVG RED PATH DRAWING -->

            <svg id="pathOverlay"></svg>

            <!-- LETTER GRID -->

            <div
                id="letterGrid"
                class="grid"
            >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

                <input
                    type="text"
                    maxlength="1"
                    autocomplete="off"
                >

            </div>

        </div>

        <!-- BUTTONS -->

        <div class="button-row">

            <button id="solveBtn">
                Solve
            </button>

            <button id="clearBtn">
                Clear
            </button>

        </div>

        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    Words Found
                </div>

                <div
                    id="wordCount"
                    class="stat-value"
                >
                    0
                </div>

            </div>

        </div>

        <!-- RESULTS -->

        <div
            id="results"
            class="results"
        >

            <div class="placeholder">

                Enter letters and click
                Solve.

            </div>

        </div>

    </div>

    <script>

        // Auto move to next tile

        const inputs =
            document.querySelectorAll(
                '#letterGrid input'
            );

        inputs.forEach(
            (input, index) => {

                input.addEventListener(
                    'input',
                    e => {

                        e.target.value =
                            e.target.value
                            .toUpperCase();

                        if (
                            e.target.value &&
                            index <
                            inputs.length - 1
                        ) {

                            inputs[
                                index + 1
                            ].focus();
                        }
                    }
                );

                input.addEventListener(
                    'keydown',
                    e => {

                        if (
                            e.key ===
                            'Backspace' &&
                            !input.value &&
                            index > 0
                        ) {

                            inputs[
                                index - 1
                            ].focus();
                        }
                    }
                );
            }
        );

        // Clear Board

        document
            .getElementById(
                'clearBtn'
            )
            .addEventListener(
                'click',
                () => {

                    inputs.forEach(
                        input => {

                            input.value =
                                '';

                            input.classList.remove(
                                'highlight'
                            );
                        }
                    );

                    const svg =
                        document.getElementById(
                            'pathOverlay'
                        );

                    svg.innerHTML = '';

                    document
                        .getElementById(
                            'results'
                        )
                        .innerHTML =
                        `
                        <div class="placeholder">
                            Enter letters and click Solve.
                        </div>
                        `;

                    document
                        .getElementById(
                            'wordCount'
                        )
                        .textContent =
                        '0';

                    inputs[0].focus();
                }
            );

    </script>

    <script src="script.js"></script>

</body>
</html>
